[workspace]
resolver = "2"
members = ["inkcraft"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
winit = "0.30.13"
wgpu = "30.0.2"
skia-safe = { version = "0.157.0", features = ["pdf"] }
rstar = "0.14.0"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
hayro = "0.9.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
crossbeam-channel = "0.5.17"
pollster = "0.4"
